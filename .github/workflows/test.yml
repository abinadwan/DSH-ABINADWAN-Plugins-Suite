name: Plugin checks
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Audit locked dependency graph (moderate and above)
        run: npm audit --audit-level=moderate
      - run: npm run check:client
      - run: npm test
      - run: npm run check:package

      - name: Install pinned Harness integration fixtures
        run: >-
          npm install --no-save --package-lock=false --ignore-scripts
          @deepseek-ai/dsh-system-prompt@0.2.2-rc.3 @deepseek-ai/dsh-agent@0.2.2-rc.3 @deepseek-ai/dsh-agent-loop@0.2.2-rc.3 @deepseek-ai/dsh-session@0.2.2-rc.3 @deepseek-ai/dsh-session-projection@0.2.2-rc.3 @deepseek-ai/dsh-session-persistence@0.2.2-rc.3 @deepseek-ai/dsh-tools@0.2.2-rc.3 @deepseek-ai/dsh-tool-executor-native@0.2.2-rc.3 @deepseek-ai/dsh-llm@0.2.2-rc.3
          @deepseek-ai/dsh-client-connection@0.2.2-rc.3 @deepseek-ai/dsh-session-persistence-jsonl@0.2.2-rc.3
          @deepseek-ai/dsh-storage@0.2.2-rc.3 @deepseek-ai/dsh-storage-json@0.2.2-rc.3 @deepseek-ai/dsh-storage-domain@0.2.2-rc.3
          @deepseek-ai/dsh-workspace@0.2.2-rc.3 @deepseek-ai/dsh-session-query-sqlite@0.2.2-rc.3 @deepseek-ai/dsh-agent-preset-registry@0.2.2-rc.3
          @deepseek-ai/dsh-settings@0.2.2-rc.3 @deepseek-ai/dsh-config-editor@0.2.2-rc.3
      - name: Exercise pinned Harness services with synthetic data
        env:
          ABINADWAN_TEST_RUNTIME: ${{ github.workspace }}
        run: >-
          node --test qa/profile-host-check.mjs qa/adaptive-reasoning-host-check.mjs
          qa/direct-chat-catalog-host-check.mjs qa/new-plugins-host-check.mjs qa/humanizer-studio-host-check.mjs
      - name: Final candidate regression map and deterministic classifier benchmark
        run: npm run check:regression
