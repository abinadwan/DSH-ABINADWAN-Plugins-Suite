name: Plugin checks
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check:package

      - name: Install pinned Harness integration fixtures
        run: npm install --no-save --package-lock=false --ignore-scripts @deepseek-ai/dsh-system-prompt@0.2.2-rc.3 @deepseek-ai/dsh-agent@0.2.2-rc.3 @deepseek-ai/dsh-agent-loop@0.2.2-rc.3 @deepseek-ai/dsh-session@0.2.2-rc.3 @deepseek-ai/dsh-session-projection@0.2.2-rc.3 @deepseek-ai/dsh-session-persistence@0.2.2-rc.3 @deepseek-ai/dsh-tools@0.2.2-rc.3 @deepseek-ai/dsh-tool-executor-native@0.2.2-rc.3 @deepseek-ai/dsh-llm@0.2.2-rc.3
      - name: Exercise actual Harness Agent Loop with offline adapter
        run: node --test qa/profile-host-check.mjs
